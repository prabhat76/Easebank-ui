<div class="min-h-screen bg-gray-50" [class.native-app]="isNative">
  @if (isAuthenticated) {
    <!-- Top Navigation - Desktop Only -->
    <nav class="bg-white shadow-sm border-b mobile-safe-area hidden md:block">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
          <div class="flex items-center">
            <app-logo size="sm" [showTagline]="false"></app-logo>
          </div>
          <div class="flex items-center space-x-4">
            <a routerLink="/dashboard" routerLinkActive="text-blue-600" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">Dashboard</a>
            <a routerLink="/wealth" routerLinkActive="text-blue-600" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">Wealth</a>
            <a routerLink="/cards" routerLinkActive="text-blue-600" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">Cards</a>
            <a routerLink="/payments" routerLinkActive="text-blue-600" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">Payments</a>
            <a routerLink="/transactions" routerLinkActive="text-blue-600" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">Transactions</a>
            <button (click)="logout()" class="text-gray-700 hover:text-red-600 px-3 py-2 rounded-md text-sm font-medium">Logout</button>
          </div>
        </div>
      </div>
    </nav>
    
    <!-- Main Content with bottom padding for mobile nav -->
    <main class="max-w-7xl mx-auto mobile-safe-area pb-20 md:pb-6">
      <router-outlet />
    </main>

    <!-- Bottom Navigation - Mobile Only (Only when authenticated) -->
    <app-bottom-nav></app-bottom-nav>
  } @else {
    <!-- Login Page - No Navigation -->
    <div class="mobile-safe-area">
      <router-outlet />
    </div>
  }
</div>
